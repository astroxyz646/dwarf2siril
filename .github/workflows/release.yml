name: Release

# Push a tag like v0.1.0 and this builds the exe and publishes it as a
# release. Run it manually from the Actions tab to get a test build without
# publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed for `gh release create` to write to the repo.
permissions:
  contents: write

jobs:
  build:
    # PyInstaller does not cross-compile: a Windows exe needs a Windows runner.
    runs-on: windows-latest
    # A hung Qt test would otherwise sit there for six hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install PySide6 pyinstaller

      # Deliberately NOT run with QT_QPA_PLATFORM=offscreen: the layout tests
      # hang under it. Windows runners have a desktop session, so the normal
      # Qt platform plugin works.
      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build the exe
        run: python packaging/build_exe.py --clean

      # Kept for 90 days on every run, tagged or not, so a manual build is
      # downloadable without publishing a release.
      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dwarf2Siril-exe
          path: dist/onefile/Dwarf2Siril.exe
          if-no-files-found: error

      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @'
          Download **Dwarf2Siril.exe** below and double-click it. No Python, no
          install, no command line.

          Windows will warn you on first run because the file is unsigned:
          **More info** then **Run anyway**.

          You also need [Siril](https://siril.org/) 1.4 or newer installed to
          do the actual stacking. The app finds it for you.
          '@ | Out-File notes.md -Encoding utf8

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist/onefile/Dwarf2Siril.exe" `
            --title "Dwarf2Siril $env:GITHUB_REF_NAME" `
            --notes-file notes.md
